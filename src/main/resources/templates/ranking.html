<!DOCTYPE html>
<html class="h-100" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/head :: header}" />
    <title>IW: Welcome</title>
</head>

<body class="d-flex flex-column h-100">
    <header th:replace="~{fragments/nav.html :: nav}"></header>

    <main class="flex-shrink-0">
        <div class="container">
            <h1 class="mt-5 mb-4">🏆 Top Platos UCM</h1>
            
            <div class="mb-4">
                <span class="me-2 fw-bold">Ordenar por:</span>
                <button class="btn btn-outline-primary btn-sm me-2" onclick="ordenarPlatos('votos')">
                    ⭐ Más votados
                </button>
                <button class="btn btn-outline-secondary btn-sm" onclick="ordenarPlatos('nombre')">
                    🔤 Nombre (A-Z)
                </button>
            </div>

            <div id="contenedor-platos" class="row row-cols-1 row-cols-md-3 g-4 platos">
                
                <div class="col plato-card" th:each="p : ${platos}" th:data-votos="${p.votos.size()}" th:data-nombre="${p.nombre}">
                    <div class="card h-100 shadow-sm">
                        <img th:src="@{/img/{name}(name=${p.imagen})}" class="card-img-top" alt="Plato" style="height: 200px; object-fit: cover;">
                        <div class="card-body">
                            <h5 class="card-title " th:text = "${p.nombre}">Nombre plato</h5>
                            <div class="mb-4"> 
                                <select class="form-select form-select-lg select-facultad shadow-sm" name="facultadId">
                                    <option th:each="f : ${p.facultades}" 
                                            th:value="${f.id}" 
                                            th:text="${f.nombre}">Facultad</option>
                                </select>
                            </div>
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="badge bg-warning text-dark fs-6" th:text="'⭐ ' + ${p.valoracion}">Valoracion</span>
                                <div>
                                    <small class="text-muted" th:text="'Votos ' + ${p.votos.size()}"> votos</small>
                                </div>
                                
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <th:block th:replace="~{fragments/footer.html :: footer}" />

    <script>
        function ordenarPlatos(criterio) {
            // 1. Seleccionamos el contenedor y las tarjetas
            const contenedor = document.getElementById('contenedor-platos');
            const tarjetas = Array.from(contenedor.getElementsByClassName('plato-card'));

            // 2. Ordenamos el array de tarjetas
            tarjetas.sort((a, b) => {
                if (criterio === 'votos') {
                    // De mayor a menor (descendente)
                    // parseInt convierte el texto "95" en número 95
                    return parseInt(b.dataset.votos) - parseInt(a.dataset.votos);
                } else if (criterio === 'nombre') {
                    // Alfabético (A-Z)
                    return a.dataset.nombre.localeCompare(b.dataset.nombre);
                }
            });

            // 3. Volvemos a añadir las tarjetas al contenedor en el nuevo orden
            // (Esto mueve los elementos en el HTML, no los duplica)
            tarjetas.forEach(tarjeta => contenedor.appendChild(tarjeta));
        }
    </script>
</body>

</html>
