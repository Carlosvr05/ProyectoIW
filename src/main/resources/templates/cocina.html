<!DOCTYPE html>
<html class="h-100" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: header}" />
    <title>MenUni - Panel de Cocina</title>
    <style>
        .pedido-card-cocina {
            transition: all 0.3s ease;
            border-left: 5px solid #ffc107; /* Amarillo para solicitado */
        }
        .pedido-card-preparando {
            border-left: 5px solid #0dcaf0; /* Azul para preparando */
        }
        .pedido-card-cocina:hover {
            transform: translateY(-3px);
        }
    </style>
</head>
<body class="d-flex flex-column h-100 bg-light">
    <!-- Navegación principal -->
    <header th:replace="~{fragments/nav.html :: nav}"></header>

    <main class="flex-shrink-0 container my-4">
        
        <!-- Encabezado del panel -->
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
            <div>
                <h1 class="display-6 fw-bold text-primary mb-1"><i class="bi bi-egg-fried"></i> Monitor de Cocina</h1>
                <p class="text-muted mb-0">Pedidos entrantes en tiempo real. No es necesario refrescar.</p>
            </div>
            <div>
                <span class="badge bg-success fs-6 shadow-sm"><i class="bi bi-wifi"></i> Conexión en vivo activa</span>
            </div>
        </div>

        <!-- Grid de pedidos de cocina -->
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="contenedor-pedidos-cocina">
            
            <!-- Bucle Thymeleaf para cargar los pedidos preexistentes (Solicitados o Preparando) -->
            <div class="col" th:each="pedido : ${pedidos}" th:id="'pedido-card-cocina-' + ${pedido.id}">
                <div class="card h-100 shadow-sm pedido-card-cocina" 
                     th:classappend="${pedido.estado.name() == 'PREPARANDO'} ? 'pedido-card-preparando' : ''">
                    
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="card-title text-primary fw-bold mb-0">Pedido #<span th:text="${pedido.id}"></span></h5>
                            <span class="badge rounded-pill bg-light text-primary border border-primary px-3 py-1 fw-bold label-estado" 
                                  th:text="${pedido.estado}"></span>
                        </div>
                        
                        <div class="mb-3 small text-muted">
                            <i class="bi bi-person"></i> Cliente: <strong th:text="${pedido.cliente.username}"></strong><br>
                            <i class="bi bi-clock"></i> Recibido: <span th:text="${pedido.fechaCompra != null ? #temporals.format(pedido.fechaCompra, 'HH:mm') : 'Ahora'}"></span>
                        </div>

                        <!-- Lista de platos del pedido -->
                        <ul class="list-group list-group-flush mb-3">
                            <li class="list-group-item d-flex justify-content-between align-items-center px-0 py-2 border-0 border-bottom border-light" 
                                th:each="linea : ${pedido.lineas}">
                                <span class="text-dark" th:text="${linea.plato.nombre}">Plato</span>
                                <span class="badge bg-secondary rounded-pill" th:text="${linea.cantidad} + ' ud'"></span>
                            </li>
                        </ul>
                    </div>

                    <!-- Botón de control de estados -->
                    <div class="card-footer bg-white border-top-0 pb-3">
                        <button type="button" class="btn btn-primary w-100 fw-bold btn-avanzar-estado" 
                                th:attr="onclick='avanzarEstadoPedido(' + ${pedido.id} + ')'">
                            <i class="bi bi-arrow-right-circle"></i> <span th:text="${pedido.estado.name() == 'SOLICITADO'} ? 'Comenzar Preparación' : 'Marcar como Listo'"></span>
                        </button>
                    </div>
                </div>
            </div>

        </div>

        <!-- Alerta si no hay pedidos -->
        <div id="sin-pedidos-alerta" class="alert alert-info border shadow-sm p-4 text-center mt-4" 
             th:style="${#lists.isEmpty(pedidos)} ? 'display: block;' : 'display: none;'">
            <i class="bi bi-emoji-smile fs-2 d-block mb-2 text-primary"></i>
            <h5 class="fw-bold mb-1">¡Cocina al día!</h5>
            <p class="text-muted mb-0 small">No hay pedidos pendientes de preparar en este momento. Las nuevas comandas aparecerán en tiempo real.</p>
        </div>

    </main>

    <th:block th:replace="~{fragments/footer.html :: footer}" />

    <!-- Lógica de WebSockets en tiempo real -->
    <script th:inline="javascript">
        // Generar un beep sintético para alertar a la cocina
        function sonarAlertaComanda() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(587.33, audioCtx.currentTime); // Nota Re5 (agradable)
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15); // Duración de 150ms
            } catch (e) {
                console.log("No se pudo reproducir audio en comanda:", e);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            // Suscripción al tópico de cocina si WebSockets está activo
            if (ws.stompClient) {
                ws.stompClient.subscribe('/topic/pedidos-cocina', function(msg) {
                    const pedido = JSON.parse(msg.body);
                    sonarAlertaComanda();
                    agregarPedidoPantalla(pedido);
                });
            }
        });

        /**
         * Inyecta dinámicamente la comanda del pedido en pantalla
         */
        function agregarPedidoPantalla(pedido) {
            // Ocultamos la alerta de cocina vacía
            document.getElementById('sin-pedidos-alerta').style.display = 'none';

            // Comprobar si el pedido ya existe en pantalla para evitar duplicados
            if (document.getElementById(`pedido-card-cocina-${pedido.id}`)) return;

            // Construir lista de platos en HTML
            let platosHtml = '';
            pedido.items.forEach(item => {
                platosHtml += `
                    <li class="list-group-item d-flex justify-content-between align-items-center px-0 py-2 border-0 border-bottom border-light">
                        <span class="text-dark">${item.platoNombre}</span>
                        <span class="badge bg-secondary rounded-pill">${item.cantidad} ud</span>
                    </li>`;
            });

            // Tarjeta completa en HTML
            const tarjetaHtml = `
                <div class="col" id="pedido-card-cocina-${pedido.id}">
                    <div class="card h-100 shadow-sm pedido-card-cocina border-5">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5 class="card-title text-primary fw-bold mb-0">Pedido #${pedido.id}</h5>
                                <span class="badge rounded-pill bg-light text-primary border border-primary px-3 py-1 fw-bold label-estado">${pedido.estado}</span>
                            </div>
                            <div class="mb-3 small text-muted">
                                <i class="bi bi-person"></i> Cliente: <strong>${pedido.cliente}</strong><br>
                                <i class="bi bi-clock"></i> Recibido: <span>${pedido.hora}</span>
                            </div>
                            <ul class="list-group list-group-flush mb-3">
                                ${platosHtml}
                            </ul>
                        </div>
                        <div class="card-footer bg-white border-top-0 pb-3">
                            <button type="button" class="btn btn-primary w-100 fw-bold btn-avanzar-estado" onclick="avanzarEstadoPedido(${pedido.id})">
                                <i class="bi bi-arrow-right-circle"></i> <span>Comenzar Preparación</span>
                            </button>
                        </div>
                    </div>
                </div>`;

            // Insertamos al principio del contenedor para ver primero los más nuevos
            document.getElementById('contenedor-pedidos-cocina').insertAdjacentHTML('afterbegin', tarjetaHtml);
        }

        /**
         * Llama de forma asíncrona al controlador para cambiar el estado del pedido
         */
        function avanzarEstadoPedido(id) {
            go(`/plato/cocina/completar/${id}`, 'POST')
                .then(res => {
                    if (res.status === 'ok') {
                        const card = document.getElementById(`pedido-card-cocina-${id}`);
                        if (res.nuevoEstado === 'LISTO' || res.nuevoEstado === 'ENTREGADO') {
                            // Si ya está listo o entregado, lo desvanecemos y eliminamos de la vista
                            card.classList.add('opacity-0');
                            setTimeout(() => {
                                card.remove();
                                // Si ya no quedan tarjetas en pantalla, mostramos alerta
                                if (document.querySelectorAll('.pedido-card-cocina').length === 0) {
                                    document.getElementById('sin-pedidos-alerta').style.display = 'block';
                                }
                            }, 300);
                        } else {
                            // Si avanzó a PREPARANDO, cambiamos la clase y el texto del botón
                            card.querySelector('.pedido-card-cocina').classList.add('pedido-card-preparando');
                            card.querySelector('.label-estado').innerText = res.nuevoEstado;
                            card.querySelector('.btn-avanzar-estado span').innerText = 'Marcar como Listo';
                        }
                    }
                })
                .catch(err => {
                    console.error("Error al actualizar pedido:", err);
                    alert("Error de permisos o conexión al cambiar estado del pedido.");
                });
        }
    </script>
</body>
</html>
