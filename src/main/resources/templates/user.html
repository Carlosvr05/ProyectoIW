<!DOCTYPE html>
<html class="h-100" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/head :: header}" />
    <title>IW: Perfil</title>
</head>

<body class="d-flex flex-column h-100">
    <header th:replace="~{fragments/nav.html :: nav}"></header>

    <main class="flex-shrink-0 container mt-4">
        <ul class="nav nav-tabs" id="perfilTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="general-tab" data-bs-toggle="tab" data-bs-target="#general" type="button" role="tab" aria-controls="general" aria-selected="true">General</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="pedidos-tab" data-bs-toggle="tab" data-bs-target="#pedidos" type="button" role="tab" aria-controls="pedidos" aria-selected="false">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-qr-code-scan me-2" viewBox="0 0 16 16">
                        <path d="M1.5 1a.5.5 0 0 0-.5.5v3a.5.5 0 0 1-1 0v-3A1.5 1.5 0 0 1 1.5 0h3a.5.5 0 0 1 0 1h-3zM11 .5a.5.5 0 0 1 .5-.5h3A1.5 1.5 0 0 1 16 1.5v3a.5.5 0 0 1-1 0v-3a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 1-.5-.5zM.5 11a.5.5 0 0 1 .5.5v3a.5.5 0 0 0 .5.5h3a.5.5 0 0 1 0 1h-3A1.5 1.5 0 0 1 0 14.5v-3a.5.5 0 0 1 .5-.5zm15 0a.5.5 0 0 1 .5.5v3a1.5 1.5 0 0 1-1.5 1.5h-3a.5.5 0 0 1 0-1h3a.5.5 0 0 0 .5-.5v-3a.5.5 0 0 1 .5-.5zM7 7h2v2H7V7z"/>
                        <path d="M3 4.5a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-2zm1 2h1v-1H4v1zm6-2a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-2zm1 2h1v-1h-1v1zm-7 6a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-2zm1 2h1v-1H4v1zm6-2a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-2zm1 2h1v-1h-1v1z"/>
                    </svg>
                    Mis Pedidos (QRs)
                </button>
            </li>
        </ul>
        <div class="tab-content border border-top-0 p-4 rounded-bottom" id="perfilTabsContent">
            
            <!-- PESTAÑA GENERAL -->
            <div class="tab-pane fade show active" id="general" role="tabpanel" aria-labelledby="general-tab">
                <div id="books" class="border border-2 border-primary rounded p-2 mb-3">
                    <label for="isbn">ISBN</label><input id="isbn" value="9780140328721" />
                    <button id="fetchBook">Buscar datos online</button>
                    <img class="preview" id="portada" alt="portada del libro" />
                    <form th:action="@{/user/__${user.id}__/pic}">
                        <button id="postPortada" class="perfilable">Usar como foto de perfil</button>
                    </form>
                </div>
                <div id="movies" class="border border-2 border-secondary rounded p-2 mb-3">
                    <label for="imdb">IMDB</label><input id="imdb" value="tt11286314" />
                    <button id="fetchMovie">Buscar datos online</button>
                    <img class="preview" id="poster" alt="poster de la pelicula" />
                    <form th:action="@{/user/__${user.id}__/pic}">
                        <button id="postPoster" class="perfilable">Usar como foto de perfil</button>
                    </form>
                </div>
                <div id="profile" class="border border-2 border-tertiary rounded p-2 mb-3">
                    <input type="file" id="f_avatar" accept="image/jpeg,image/png">
                    <img class="preview" id="avatar" alt="careto a subir" />
                    <form th:action="@{/user/__${user.id}__/pic}">
                        <button id="postAvatar">Usar como foto de perfil</button>
                    </form>
                </div>

                <div class="container mt-4">
                    <h1 class="mt-5">Perfil de <span th:text="${user.username}">Paco</span></h1>
                    <!-- recepción de mensajes -->
                    <div class="py-5 row" id="mensajes">
                    </div>
                    <!-- envío de mensajes -->
                    <div class="py-5 row ">
                        <form th:action="@{/user/__${user.id}__/msg}" method="POST">
                            <input type="text" id="message" placeholder="escribe a este usuario" />
                            <button id="sendmsg" class="btn btn-secondary" type="submit">Enviar</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="pedidos" role="tabpanel" aria-labelledby="pedidos-tab">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3>Mis Pedidos y Códigos QR</h3>
                    <span class="badge bg-info text-dark">Escanea para verificar</span>
                </div>
                
                <p th:if="${pedidos == null or pedidos.isEmpty()}" class="alert alert-light border">No tienes pedidos actualmente. Cuando realices un pedido, aparecerá aquí con su código QR.</p>
                
                <div class="row" th:if="${pedidos != null and !pedidos.isEmpty()}">
                    <div class="col-md-6 col-lg-4 mb-4" th:each="pedido : ${pedidos}">
                        <div class="card h-100 shadow-sm border-0 bg-light">
                            <div class="card-body text-center p-4">
                                <div class="mb-3">
                                    <h5 class="card-title text-primary mb-1">Pedido #<span th:text="${pedido.id}"></span></h5>
                                    <span class="badge rounded-pill bg-white text-primary border border-primary px-3" th:text="${pedido.estado}"></span>
                                </div>
                                
                                <!-- Contenedor del QR con estilo de ticket -->
                                <div class="bg-white p-3 rounded shadow-sm d-inline-block mb-3 border border-dashed">
                                    <div class="qrcode-container" th:attr="data-qr-text='Pedido ID: ' + ${pedido.id} + ' | Cliente: ' + ${user.username} + ' | Estado: ' + ${pedido.estado}"></div>
                                </div>
                                
                                <p class="small text-muted mt-2">Muestra este código en la cafetería para recoger tu pedido.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <th:block th:replace="~{fragments/footer.html :: footer}" />

    <script th:src="@{/js/ajax-demo.js}"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Generar QRs
            var qrContainers = document.querySelectorAll(".qrcode-container");
            qrContainers.forEach(function(container) {
                var text = container.getAttribute("data-qr-text");
                new QRCode(container, {
                    text: text,
                    width: 150,
                    height: 150,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
            });

            // Si la URL termina en #pedidos, abrir automáticamente la pestaña de QRs
            if (window.location.hash === '#pedidos') {
                var triggerEl = document.querySelector('#pedidos-tab');
                if (triggerEl) {
                    bootstrap.Tab.getOrCreateInstance(triggerEl).show();
                }
            }
        });
    </script>
</body>

</html>
