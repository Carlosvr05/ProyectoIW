<!DOCTYPE html>
<html class="h-100" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/head :: header}" />
    <title>MenUni: Carta</title>
</head>

<body class="d-flex flex-column h-100">
    <!-- Navegación principal -->
    <header th:replace="~{fragments/nav.html :: nav}"></header>

    <main class="flex-shrink-0">
        <div class="container mt-5 mb-5">
            <!-- Título dinámico: Muestra la facultad seleccionada o un texto genérico -->
            <h1 class="mb-4 text-center"
                th:text="${facultadSeleccionada != null ? 'Menú de ' + facultadSeleccionada.nombre : 'Nuestros Platos'}">
                Nuestros Platos
            </h1>

            <div class="row row-cols-1 row-cols-md-3 g-4">
                <!-- Bucle para recorrer la lista de platos pasados desde el controlador -->
                <div class="col" th:each="p : ${platos}">
                    <div class="card h-100 shadow border-0 plato-card overflow-hidden">

                        <!-- Sección de Imagen y Precio Base -->
                        <div class="position-relative">
                            <img th:src="@{/plato/{id}/pic(id=${p.id})}" class="card-img-top" th:alt="${p.nombre}"
                                style="height: 300px; object-fit: cover;" onerror="this.src='/img/MenUni.png';">

                            <!-- Etiqueta de precio superpuesta en la esquina superior derecha -->
                            <div class="position-absolute top-0 end-0 m-3">
                                <span class="badge bg-dark fs-4 shadow precio-base" th:attr="data-precio=${p.precio}"
                                    th:text="${#numbers.formatDecimal(p.precio, 1, 2) + ' €'}">0.00 €</span>
                            </div>
                        </div>

                        <!-- Sección de Detalles del Plato y Acciones -->
                        <div class="card-body p-4 d-flex flex-column">
                            <h2 class="card-title fw-bold mb-3" th:text="${p.nombre}">Nombre del Plato</h2>
                            <p class="card-text text-muted fs-5 flex-grow-1" th:text="${p.descripcion}">
                                Descripción detallada del plato.
                            </p>

                            <hr class="my-4">

                            <!-- Mensaje para usuarios NO autenticados (invitados) -->
                            <div th:if="${u == null}" class="alert alert-light border shadow-sm mb-0 p-2 text-center"
                                style="font-size: 0.9rem;">
                                <a th:href="@{/login}" class="fw-bold">Inicia sesión</a> para pedir.
                            </div>

                            <!-- Formulario de pedido (solo visible para usuarios normales autenticados) -->
                            <form th:if="${u != null and !u.hasRole('ADMIN')}"
                                th:action="@{/carrito/add/{id}(id=${p.id})}" method="POST">

                                <!-- Selección de Cafetería / Facultad -->
                                <div class="mb-4">
                                    <label class="form-label fw-bold text-secondary">
                                        <i class="bi bi-geo-alt-fill me-1"></i> Selecciona Cafetería:
                                    </label>
                                    <select class="form-select form-select-lg select-facultad shadow-sm"
                                        name="facultadId">
                                        <option th:each="f : ${p.facultades}" th:value="${f.id}" th:text="${f.nombre}"
                                            th:selected="${facultadSeleccionada != null and f.id == facultadSeleccionada.id}">
                                            Facultad
                                        </option>
                                        <option th:if="${#lists.isEmpty(p.facultades)}" disabled selected>
                                            No disponible en facultades
                                        </option>
                                    </select>
                                </div>

                                <!-- Controles de Cantidad y Botón de Añadir -->
                                <div class="row g-3 align-items-center">
                                    <div class="col-4">
                                        <label
                                            class="small text-uppercase fw-bold text-muted d-block mb-1">Cantidad</label>
                                        <input type="number" name="cantidad"
                                            class="form-control form-control-lg input-cantidad shadow-sm" value="1"
                                            min="1">
                                    </div>
                                    <div class="col-8">
                                        <label
                                            class="small text-uppercase fw-bold text-muted d-block mb-1">&nbsp;</label>
                                        <div class="acciones d-grid">
                                            <button type="submit" class="btn btn-primary w-100"
                                                th:disabled="${#lists.isEmpty(p.facultades)}">
                                                Añadir al carrito - <span class="precio-total"
                                                    th:text="${#numbers.formatDecimal(p.precio, 1, 2)}">0.00</span> €
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </form>

                            <!-- Mensaje informativo para Administradores -->
                            <div th:if="${u != null and u.hasRole('ADMIN')}"
                                class="alert alert-info border-0 mb-0 p-2 text-center">
                                <small>Vista de Administrador: Los pedidos se gestionan en el panel.</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Inclusión del pie de página -->
    <th:block th:replace="~{fragments/footer.html :: footer}" />

    <!-- Script para actualizar dinámicamente el precio total al modificar la cantidad -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Iteramos sobre todas las tarjetas de platos
            document.querySelectorAll('.plato-card').forEach(card => {
                const input = card.querySelector('.input-cantidad');
                const precioBaseElem = card.querySelector('.precio-base');
                const precioTotalElem = card.querySelector('.precio-total');

                // Aseguramos que los elementos existan (pueden faltar si el usuario no está logueado o es admin)
                if (input && precioBaseElem && precioTotalElem) {
                    const precioBase = parseFloat(precioBaseElem.getAttribute('data-precio'));

                    // Calcula y muestra el precio en base a la cantidad
                    function actualizarPrecio() {
                        let cantidad = parseInt(input.value);
                        if (isNaN(cantidad) || cantidad < 1) {
                            cantidad = 1; // Previene valores inválidos
                        }
                        let total = (precioBase * cantidad).toFixed(2);
                        precioTotalElem.textContent = total;
                    }

                    // Se dispara al cambiar el valor con las flechas o al teclear
                    input.addEventListener('change', actualizarPrecio);
                    input.addEventListener('keyup', actualizarPrecio);
                }
            });
        });
    </script>
</body>

</html>
